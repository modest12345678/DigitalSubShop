<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#c8b6ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Outer Rounded Shape -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#080a0e" stroke="url(#grad)" stroke-width="3" />
  <!-- Shield Outline -->
  <path d="M32 14 L46 20 V33 C46 43 32 50 32 50 C32 50 18 43 18 33 V20 Z" fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Center Verified Checkmark -->
  <path d="M26 31 L30 35 L38 27" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
